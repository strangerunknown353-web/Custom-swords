name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The project has zero runtime and zero dev dependencies, so there is
      # nothing to install.

      - name: Generated content is up to date
        run: node tools/generate.mjs --check

      - name: Sword catalogue is up to date
        run: node tools/catalog.mjs --check

      - name: Validate packs and architecture rules
        run: npm run validate

      - name: Unit tests
        run: npm test

      - name: Build .mcaddon
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: custom-swords-mcaddon
          path: dist/*.mcaddon
          if-no-files-found: error
